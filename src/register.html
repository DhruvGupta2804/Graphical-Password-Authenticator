<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
      <h1>Register</h1>
      <form id="registerForm">
        <div class="input-box">
          <input type="text" id="username" placeholder="Username" required>
        </div>
        <button type="button" id="generateBtn" class="btn">Generate Password Options</button>
      </form>
      <br>
      <p class="register-link"><a href="/login">Already have an account? Login</a></p>

      <div id="password-options" style="margin-top: 20px; width: 100%;"></div>

    </div>
    <script src="register.js"></script>
</body>
</html>
